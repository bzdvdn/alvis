name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Typecheck (mypy)
        run: mypy src/alvis

      - name: Tests (pytest)
        run: pytest --cov=alvis --cov-report=term-missing --cov-fail-under=90

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Golden tests (read-only snapshots)
        run: pytest -m golden

      - name: Golden coverage (every connector ships fixture + snapshot)
        run: python scripts/check_golden_coverage.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (runtime deps + extras)
        run: pip install -e ".[documents,pgindex,observability]"

      - name: Audit dependencies (pip-audit)
        run: pip install pip-audit && pip-audit

  integration:
    name: Qdrant integration
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.13.6
        ports:
          - 6333:6333
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:6333/readyz || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Filesystem -> Qdrant -> query -> incremental -> reconcile
        env:
          ALVIS_QDRANT_URL: http://localhost:6333
        run: pytest -m integration
