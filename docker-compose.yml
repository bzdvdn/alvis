name: alvis-dev

services:
  qdrant:
    image: qdrant/qdrant:v1.10.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  mock-confluence:
    build: ./docker/mock-confluence
    ports:
      - "8090:8090"

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_storage:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/alvis &&
      mc cp --recursive /seed/ local/alvis/
      "
    volumes:
      - ./examples/s3-seed:/seed:ro

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: alvis
      POSTGRES_PASSWORD: alvis
      POSTGRES_DB: alvis
    ports:
      - "5433:5432"
    volumes:
      - pg_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alvis -d alvis"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  qdrant_storage:
  minio_storage:
  pg_storage:
