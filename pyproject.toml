[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alvis"
version = "0.6.0"
description = "No-code framework for building corporate knowledge bases from heterogeneous sources"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alvis contributors" }]
keywords = ["rag", "ingestion", "knowledge-base", "etl", "search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "typer>=0.12",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
documents = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]
pgindex = [
    "psycopg[binary]>=3.1",
]
observability = [
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.1",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[project.urls]
Homepage = "https://github.com/bzdvdn/alvis"
Documentation = "https://github.com/bzdvdn/alvis#readme"

[project.scripts]
alvis = "alvis.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/alvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "golden: connector golden-snapshot test (run via pytest -m golden)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]